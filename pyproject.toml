[project]
name = "tutor-heaven"
version = "1.0.0-beta.2"
description = "Private tutor management application"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
    {name = "zaov", email = "zaov@users.noreply.github.com"}
]
keywords = ["tutor", "english", "education", "classes", "management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "PySide6>=6.5",
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/zaovb/TutorHeaven"
Repository = "https://github.com/zaovb/TutorHeaven"
Issues = "https://github.com/zaovb/TutorHeaven/issues"

[project.scripts]
tutor-heaven = "tutor_heaven.main:main"

# Sistema de empaquetado: usa setuptools para construir/instalar el paquete.
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# El código fuente vive dentro de src/ (layout "src layout").
[tool.setuptools]
package-dir = {"" = "src"}

# Se empaquetan todos los paquetes que se encuentren dentro de src/.
[tool.setuptools.packages.find]
where = ["src"]
